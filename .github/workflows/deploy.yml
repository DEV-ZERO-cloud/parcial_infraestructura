name: Construir y promover imagen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: promocion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Construir, publicar y analizar
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar nombre de imagen
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar una vez
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Analizar imagen por digest con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Publicar referencia inmutable
        id: publish
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image_ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada para commit $GITHUB_SHA: $IMAGE@$DIGEST"

  deploy-testing:
    name: Desplegar y probar en testing
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      packages: read
    steps:
      - name: Enviar digest al adaptador de despliegue
        id: deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE_REF: ${{ needs.build-and-scan.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ needs.build-and-scan.outputs.digest }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "Falta el secreto DEPLOY_WEBHOOK_URL del ambiente testing"; exit 1; }
          test -n "$DEPLOY_WEBHOOK_TOKEN" || { echo "Falta el secreto DEPLOY_WEBHOOK_TOKEN del ambiente testing"; exit 1; }
          payload="$(jq -cn --arg image "$IMAGE_REF" '{image: $image}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL")"
          deployed_digest="$(printf '%s' "$response" | jq -er '.image_digest')"
          test "$deployed_digest" = "$EXPECTED_DIGEST" || {
            echo "El adaptador confirmó un digest distinto al solicitado"
            exit 1
          }
          echo "Despliegue en testing confirmado: $IMAGE_REF"

      - name: Verificar salud HTTP
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "Falta la variable HEALTH_URL del ambiente testing"; exit 1; }
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$HEALTH_URL"
          echo "Prueba HTTP exitosa: $HEALTH_URL"

  deploy-production:
    name: Promover el mismo digest a production
    needs:
      - build-and-scan
      - deploy-testing
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Enviar el mismo digest al adaptador de despliegue
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE_REF: ${{ needs.build-and-scan.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ needs.build-and-scan.outputs.digest }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "Falta el secreto DEPLOY_WEBHOOK_URL del ambiente production"; exit 1; }
          test -n "$DEPLOY_WEBHOOK_TOKEN" || { echo "Falta el secreto DEPLOY_WEBHOOK_TOKEN del ambiente production"; exit 1; }
          payload="$(jq -cn --arg image "$IMAGE_REF" '{image: $image}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL")"
          deployed_digest="$(printf '%s' "$response" | jq -er '.image_digest')"
          test "$deployed_digest" = "$EXPECTED_DIGEST" || {
            echo "El adaptador de production confirmó un digest distinto al solicitado"
            exit 1
          }
          echo "Promoción a production confirmada: $IMAGE_REF"

      - name: Verificar salud HTTP en production
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "Falta la variable HEALTH_URL del ambiente production"; exit 1; }
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$HEALTH_URL"
          echo "Prueba HTTP exitosa: $HEALTH_URL"
